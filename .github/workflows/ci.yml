name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install order-service dependencies
        working-directory: ./order-service
        run: npm ci

      - name: Install inventory-service dependencies
        working-directory: ./inventory-service
        run: npm ci

      - name: Install contract-test dependencies
        working-directory: ./tests
        run: npm install

      - name: Run order-service tests
        working-directory: ./order-service
        run: npm test -- --runInBand --passWithNoTests

      - name: Run inventory-service tests
        working-directory: ./inventory-service
        run: npm test -- --runInBand --passWithNoTests

      - name: Run contract tests
        working-directory: ./tests
        run: npm test -- --runInBand

      - name: Build Docker images
        run: |
          docker build -t order-service ./order-service
          docker build -t inventory-service ./inventory-service